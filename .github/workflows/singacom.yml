# Builds the copy of the site for https://www.singacom.uva.es/~edgar/
# (base URL /~edgar) and stores it as a downloadable artifact "web-singacom".
# It does not deploy anything: download the zip from the run page in the
# Actions tab and copy its contents to the public_html folder on the server.
name: Build site for SINGACOM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll for SINGACOM
        run: bundle exec jekyll build --config _config.yml,_config_singacom.yml -d _site_singacom
        env:
          JEKYLL_ENV: production
      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: web-singacom
          path: _site_singacom/
          retention-days: 30
